<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}GAG–protein analysis{% endblock %}</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#16202b;--mut:#5b6773;--line:#dde2e8;--acc:#0f766e;--contact:#f59e0b;--motif:#06b6d4;--gag:#d946ef;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--ink:#e6ebf0;--mut:#9aa7b4;--line:#2b3744;--acc:#2dd4bf;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
header a{color:var(--ink);text-decoration:none;font-weight:700;font-size:18px}
header span{color:var(--mut);font-size:13px}
main{max-width:1280px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}
.mut{color:var(--mut)}.err{color:var(--bad);font-weight:600}
button,.btn{background:var(--acc);color:#fff;border:0;border-radius:7px;padding:8px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.sec,.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
input[type=text],select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
textarea{font-family:ui-monospace,Consolas,monospace;min-height:130px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs label{border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer}
.tabs input{display:none}.tabs input:checked+span{font-weight:700;color:var(--acc)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.seqrow{font-family:ui-monospace,Consolas,monospace;font-size:13px;display:flex;flex-wrap:wrap;gap:2px 10px;margin:6px 0}
.blk{display:inline-flex;flex-direction:column}.blk .n{font-size:9px;color:var(--mut);height:12px}
.blk .r{display:flex}
.res{display:inline-block;width:1.15ch;text-align:center;cursor:pointer;border-radius:2px;padding:0 .25ch;box-sizing:content-box}
.res:hover{outline:1px solid var(--acc)}
.res.contact{background:var(--contact);color:#111}.res.motif{background:var(--motif);color:#111}
.res.both{background:linear-gradient(135deg,var(--contact) 50%,var(--motif) 50%);color:#111}
.gap{color:var(--mut);align-self:flex-end;font-size:11px;padding:0 4px}
.chip{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--line);margin:3px 0;padding:4px 8px;font:12px ui-monospace,Consolas,monospace;border-radius:6px}
.chip:hover{border-color:var(--acc)}
#viewer{width:100%;height:560px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.note{background:rgba(245,158,11,.12);border:1px solid var(--contact);border-radius:8px;padding:8px 12px;margin-bottom:12px}
a{color:var(--acc)}
</style>
</head>
<body>
<header><a href="{{ url_for('index') }}">GAG–protein interaction analysis</a></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
